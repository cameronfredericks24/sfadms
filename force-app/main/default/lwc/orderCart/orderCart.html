<template>
    <lightning-card title="Order Cart" icon-name="standard:product_item">
        <div class="slds-p-around_medium">
            <template if:true={hasItems}>
                <div class="cart-items">
                    <template for:each={cartItems} for:item="item">
                        <div key={item.id} class="cart-item slds-box slds-m-bottom_small">
                            <div class="slds-grid slds-grid_align-spread">
                                <div class="slds-col">
                                    <p class="slds-text-heading_small">{item.name}</p>
                                    <p>Qty: {item.quantity} @ {item.unitPrice}</p>
                                </div>
                                <div class="slds-col">
                                    <lightning-button 
                                        icon-name="utility:delete"
                                        variant="destructive-text"
                                        onclick={handleRemoveItem}
                                        data-index={item.id}>
                                    </lightning-button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="slds-m-top_medium">
                    <dl class="slds-list_horizontal slds-wrap">
                        <dt class="slds-item_label slds-text-title slds-truncate">Total:</dt>
                        <dd class="slds-item_detail slds-text-heading_medium">{formattedTotal}</dd>
                    </dl>
                </div>

                <div class="slds-m-top_medium">
                    <lightning-button 
                        label="Save Order"
                        variant="brand"
                        onclick={handleSave}
                        class="slds-float_right">
                    </lightning-button>
                </div>
            </template>

            <template if:false={hasItems}>
                <div class="slds-text-align_center slds-p-around_large">
                    <p class="slds-text-color_weak">No items in cart</p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
