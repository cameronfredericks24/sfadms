<template>
    <lightning-card title="Order Cart" icon-name="standard:orders">
        <div class="slds-m-around_medium">
            <template if:true={orderLines}>
                <table class="slds-table slds-table_bordered">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Qty</th>
                            <th>Unit Price</th>
                            <th>Line Total</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={orderLines} for:item="line">
                            <tr key={line.Id}>
                                <td>{line.ProductName}</td>
                                <td>{line.Qty}</td>
                                <td>{line.UnitPrice}</td>
                                <td>{line.LineTotal}</td>
                                <td>
                                    <lightning-button-icon
                                        icon-name="utility:delete"
                                        alternative-text="Remove"
                                        onclick={handleRemoveLine}
                                        data-line-id={line.Id}
                                    ></lightning-button-icon>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            <div class="slds-m-top_medium">
                <div class="slds-text-heading_medium">Total: {totalAmount}</div>
            </div>
            <div class="slds-m-top_medium">
                <lightning-button
                    label="Apply Promotions"
                    onclick={handleApplyPromo}
                    class="slds-m-right_small"
                ></lightning-button>
                <lightning-button
                    label="Submit Order"
                    variant="brand"
                    onclick={handleSubmit}
                ></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
